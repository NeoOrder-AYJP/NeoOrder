<div class="flex flex-col items-center text-center gap-space-xs">

<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-text-main tracking-tight mt-space-xs">GastroGest</h1>
<p class="font-body-sm text-body-sm text-text-muted">Sistema de Gestão &amp; Atendimento Integrado</p>
</div>
<!-- Segmented Tab Switcher -->

<button class="py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-card text-primary shadow-sm flex items-center justify-center gap-1.5" id="tabClientBtn" type="button">
<span class="material-symbols-outlined text-[18px]">table_bar</span>

</button>
<button class="py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-transparent text-text-muted hover:text-text-main flex items-center justify-center gap-1.5" id="tabStaffBtn" type="button">
<span class="material-symbols-outlined text-[18px]">badge</span>
<span class="">Acesso da Equipe</span>
</button>
</div>
<!-- TAB 1: Mesa (Cliente) -->
<div class="flex flex-col gap-space-md" id="clientTabContent">
<!-- QR Scanner Simulated Frame -->
<div class="relative bg-surface-container-low rounded-xl p-space-md flex flex-col items-center justify-center gap-space-sm"><div class="relative w-36 h-36 bg-surface-card rounded-lg flex items-center justify-center shadow-sm"><div class="absolute inset-2 flex flex-col justify-between pointer-events-none"><div class="flex justify-between"><span class="w-4 h-4 border-t-2 border-l-2 border-primary"></span><span class="w-4 h-4 border-t-2 border-r-2 border-primary"></span></div><div class="flex justify-between"><span class="w-4 h-4 border-b-2 border-l-2 border-primary"></span><span class="w-4 h-4 border-b-2 border-r-2 border-primary"></span></div></div><div class="flex flex-col items-center justify-center text-center p-2"><span class="material-symbols-outlined text-primary text-[36px] animate-pulse">qr_code_scanner</span></div></div><p class="font-body-sm text-body-sm text-text-muted text-center max-w-xs">Aponte a câmera para o QR Code da sua mesa</p></div>
<!-- Divider -->
<div class="flex items-center gap-2">
<div class="flex-1 h-px bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-text-muted uppercase tracking-wider">ou digite o código</span>
<div class="flex-1 h-px bg-surface-container-high"></div>
</div>
<!-- Token Input Form -->
<form class="flex flex-col gap-space-md" id="clientForm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-text-main" for="tableToken">Código da Mesa</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-text-muted text-[20px]">pin</span>
<input class="w-full bg-surface text-text-main font-input-text text-input-text uppercase tracking-widest pl-11 pr-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="tableToken" maxlength="10" name="tableToken" placeholder="ex: MESA-4082" required="" type="text">
</div>
</div>
<!-- Security Pill Info -->

<!-- Action Button -->
<button class="w-full py-3.5 px-6 rounded-lg bg-primary hover:bg-primary-hover text-on-primary font-headline-md text-headline-md shadow-sm transition-all duration-200 flex items-center justify-center gap-2 mt-space-xs" id="btnTableSubmit" type="submit">
<span class="">Iniciar Sessão da Mesa</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- TAB 2: Equipe (Funcionário & Gerência) -->
<div class="hidden flex flex-col gap-space-md" id="staffTabContent">
<form class="flex flex-col gap-space-md" id="staffForm" onsubmit="event.preventDefault();">
<!-- Identity Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-text-main" for="staffEmail">E-mail Institucional ou Usuário</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-text-muted text-[20px]">alternate_email</span>
<input class="w-full bg-surface text-text-main font-input-text text-input-text pl-11 pr-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="staffEmail" name="staffEmail" placeholder="operador@gastrogest.com" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-main" for="staffPassword">Senha de Acesso</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-hover transition-colors" href="javascript:void(0)">Esqueceu a senha?</a>
</div>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-text-muted text-[20px]">lock</span>
<input class="w-full bg-surface text-text-main font-input-text text-input-text pl-11 pr-11 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="staffPassword" name="staffPassword" placeholder="••••••••••••" required="" type="password">
<button class="absolute right-3.5 text-text-muted hover:text-text-main transition-colors flex items-center" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Role & Unit Selection -->

<label class="font-label-md text-label-md text-text-main" for="staffUnit">Unidade / Terminal</label>

<span class="absolute left-3.5 material-symbols-outlined text-text-muted text-[20px]">storefront</span>
<select class="w-full bg-surface text-text-main font-input-text text-input-text pl-11 pr-10 py-3 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary shadow-sm cursor-pointer" id="staffUnit" name="staffUnit">
<option value="matriz">Unidade Matriz - Salão Principal</option>
<option value="varanda">Unidade Matriz - Deck &amp; Bar</option>
<option value="cozinha">Terminal de Produção KDS (Cozinha)</option>
<option value="gestao">Administração Central &amp; Auditoria</option>
</select>

<button class="w-full py-3.5 px-6 rounded-lg bg-primary hover:bg-primary-hover text-on-primary font-headline-md text-headline-md shadow-sm transition-all duration-200 flex items-center justify-center gap-2 mt-space-xs" id="btnStaffSubmit" type="submit">
<span class="">Acessar Painel Operacional</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
<!-- Security & Compliance Footer -->
<div class="pt-space-xs flex flex-col items-center gap-1 text-center"><p class="font-label-sm text-label-sm text-text-muted opacity-80">GastroGest • Atendimento Digital</p></div>
</div>
</div>
<script>
  (function initGastroGestAuth() {
    const tabClient = document.getElementById('tabClientBtn');
    const tabStaff = document.getElementById('tabStaffBtn');
    const contentClient = document.getElementById('clientTabContent');
    const contentStaff = document.getElementById('staffTabContent');
    const togglePass = document.getElementById('togglePasswordBtn');
    const passInput = document.getElementById('staffPassword');
    const themeBtn = document.getElementById('themeToggleBtn');
    const tableInput = document.getElementById('tableToken');

    // Switch between Client & Staff modes
    function activateTab(target) {
      if (target === 'client') {
        tabClient.className = 'py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-card text-primary shadow-sm flex items-center justify-center gap-1.5';
        tabStaff.className = 'py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-transparent text-text-muted hover:text-text-main flex items-center justify-center gap-1.5';
        contentClient.classList.remove('hidden');
        contentStaff.classList.add('hidden');
      } else {
        tabStaff.className = 'py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-card text-primary shadow-sm flex items-center justify-center gap-1.5';
        tabClient.className = 'py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-transparent text-text-muted hover:text-text-main flex items-center justify-center gap-1.5';
        contentStaff.classList.remove('hidden');
        contentClient.classList.add('hidden');
      }
    }

    if (tabClient && tabStaff) {
      tabClient.addEventListener('click', () => activateTab('client'));
      tabStaff.addEventListener('click', () => activateTab('staff'));
    }

    // Toggle Password Visibility
    if (togglePass && passInput) {
      togglePass.addEventListener('click', () => {
        const isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        const iconSpan = togglePass.querySelector('.material-symbols-outlined');
        if (iconSpan) {
          iconSpan.textContent = isPassword ? 'visibility_off' : 'visibility';
        }
      });
    }

    // Theme Toggle Handler
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const icon = themeBtn.querySelector('.material-symbols-outlined');
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          if (icon) icon.textContent = 'light_mode';
        } else {
          html.classList.add('dark');
          if (icon) icon.textContent = 'dark_mode';
        }
      });
    }

    // Auto-formatting for Table Token (e.g., MESA-XXXX)
    if (tableInput) {
      tableInput.addEventListener('input', (e) => {
        let val = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
        if (val.length === 4 && !val.includes('-')) {
          val = val + '-';
        }
        e.target.value = val;
      });
    }
  })();
</script></main>

</body></html>
