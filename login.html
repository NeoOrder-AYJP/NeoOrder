<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema — NeoOrder</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- 1º: SDK do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2º: Inicialização da API e Chaves Globais -->
  <script src="js/supabase.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo-brand">
        <span class="material-symbols-outlined">restaurant_menu</span>
        <span>NeoOrder</span>
      </a>
      <div class="nav-actions">
        <button type="button" id="btnToggleTheme" class="btn btn-secondary" style="padding: 6px 12px; min-height: 36px;" title="Alternar Tema Claro/Escuro">
          <span class="material-symbols-outlined" style="font-size: 18px;">dark_mode</span>
        </button>
        <a href="index.html" class="btn btn-secondary" style="padding: 6px 16px; min-height: 36px;">
          <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
          <span>Voltar ao Início</span>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <!-- Brand Header -->
      <div class="auth-header">
        <div class="auth-header-icon">
          <span class="material-symbols-outlined">restaurant</span>
        </div>
        <h1 class="auth-title">NeoOrder</h1>
        <p class="auth-subtitle">Sistema de Gestão & Atendimento Integrado</p>
      </div>

      <!-- Segmented Control Switcher -->
      <div class="segmented-control">
        <button type="button" class="tab-btn active" id="tabClientBtn">
          <span class="material-symbols-outlined" style="font-size: 18px;">table_bar</span>
          <span>Acesso por Mesa</span>
        </button>
        <button type="button" class="tab-btn" id="tabStaffBtn">
          <span class="material-symbols-outlined" style="font-size: 18px;">badge</span>
          <span>Acesso da Equipe</span>
        </button>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="alert-message alert-error" style="display: none;"></div>

      <!-- TAB 1: Client / Mesa -->
      <div id="clientTabContent">
        <form id="clientForm" class="flex-col">
          <div class="form-group">
            <label for="tableLogin" class="form-label">Identificador da Mesa</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">table_restaurant</span>
              <input type="text" id="tableLogin" name="tableLogin" class="input-field" placeholder="Ex: Mesa 01 ou MESA-01" required>
            </div>
          </div>

          <div class="form-group">
            <label for="tablePassword" class="form-label">Senha da Mesa</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="tablePassword" name="tablePassword" class="input-field" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="btnClientSubmit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            <span>Iniciar Sessão da Mesa</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
          </button>
        </form>
      </div>

      <!-- TAB 2: Staff / Funcionário -->
      <div id="staffTabContent" style="display: none;">
        <form id="staffForm" class="flex-col">
          <div class="form-group">
            <label for="staffLogin" class="form-label">Usuário ou E-mail</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">person</span>
              <input type="text" id="staffLogin" name="staffLogin" class="input-field" placeholder="Ex: gerente1 ou atendente1" required>
            </div>
          </div>

          <div class="form-group">
            <label for="staffPassword" class="form-label">Senha de Acesso</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="staffPassword" name="staffPassword" class="input-field" placeholder="••••••••" required>
              <button type="button" class="toggle-password" id="toggleStaffPass">
                <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
              </button>
            </div>
          </div>

          <button type="submit" id="btnStaffSubmit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            <span>Acessar Painel Operacional</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">login</span>
          </button>
        </form>
      </div>

      <!-- Security Note -->
      <div style="text-align: center; margin-top: 8px;">
        <p style="font-size: 12px; color: var(--text-muted);">NeoOrder • Atendimento & Gestão Digital</p>
      </div>
    </div>
  </main>

  <!-- 3º: Demais scripts do sistema -->
  <script src="js/auth.js"></script>
</body>
</html>
