<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema — NeoOrder</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- 1º: SDK do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2º: Inicialização da API e Chaves Globais -->
  <script src="js/supabase.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo-brand">
        <span class="material-symbols-outlined">restaurant_menu</span>
        <span>NeoOrder</span>
      </a>
      <div class="nav-actions">
        <button type="button" id="btnToggleTheme" class="btn btn-secondary" style="padding: 6px 12px; min-height: 36px;" title="Alternar Tema Claro/Escuro">
          <span class="material-symbols-outlined" style="font-size: 18px;">dark_mode</span>
        </button>
        <a href="index.html" class="btn btn-secondary" style="padding: 6px 16px; min-height: 36px;">
          <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
          <span>Voltar ao Início</span>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <!-- Brand Header -->
      <div class="auth-header">
        <div class="auth-header-icon">
          <span class="material-symbols-outlined">restaurant</span>
        </div>
        <h1 class="auth-title">NeoOrder</h1>
        <p class="auth-subtitle">Escolha seu perfil para acessar o sistema</p>
      </div>

      <!-- 4-Profile Segmented Control Switcher -->
      <div class="segmented-control" style="grid-template-columns: repeat(4, 1fr); font-size: 12px;">
        <button type="button" class="tab-btn active" id="tabMesaBtn" title="Acesso por Mesa">
          <span class="material-symbols-outlined" style="font-size: 16px;">table_bar</span>
          <span>Mesa</span>
        </button>
        <button type="button" class="tab-btn" id="tabClientBtn" title="Cliente Fidelidade">
          <span class="material-symbols-outlined" style="font-size: 16px;">person</span>
          <span>Cliente</span>
        </button>
        <button type="button" class="tab-btn" id="tabAttendantBtn" title="Atendente">
          <span class="material-symbols-outlined" style="font-size: 16px;">support_agent</span>
          <span>Atendente</span>
        </button>
        <button type="button" class="tab-btn" id="tabManagerBtn" title="Gerente">
          <span class="material-symbols-outlined" style="font-size: 16px;">manage_accounts</span>
          <span>Gerente</span>
        </button>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="alert-message alert-error" style="display: none;"></div>

      <!-- TAB 1: Mesa -->
      <div id="mesaTabContent">
        <form id="mesaForm" class="flex-col">
          <div class="form-group">
            <label for="tableLogin" class="form-label">Identificador da Mesa</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">table_restaurant</span>
              <input type="text" id="tableLogin" name="tableLogin" class="input-field" placeholder="Ex: Mesa 01 ou MESA-01" required>
            </div>
          </div>

          <div class="form-group">
            <label for="tablePassword" class="form-label">Senha da Mesa</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="tablePassword" name="tablePassword" class="input-field" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="btnMesaSubmit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            <span>Iniciar Sessão da Mesa</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
          </button>
        </form>
      </div>

      <!-- TAB 2: Cliente Fidelidade -->
      <div id="clientTabContent" style="display: none;">
        <form id="clientForm" class="flex-col">
          <div class="form-group">
            <label for="clientUserLogin" class="form-label">Usuário ou E-mail</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">person</span>
              <input type="text" id="clientUserLogin" name="clientUserLogin" class="input-field" placeholder="Ex: cliente1 ou maria@email.com" required>
            </div>
          </div>

          <div class="form-group">
            <label for="clientPassword" class="form-label">Senha</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="clientPassword" name="clientPassword" class="input-field" placeholder="••••••••" required>
            </div>
          </div>

          <div class="form-group">
            <label for="clientPhone" class="form-label">Telefone (Opcional - Programa Fidelidade)</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">phone</span>
              <input type="tel" id="clientPhone" name="clientPhone" class="input-field" placeholder="Ex: (11) 99999-8888">
            </div>
          </div>

          <button type="submit" id="btnClientSubmit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            <span>Acessar como Cliente Fidelidade</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">stars</span>
          </button>
        </form>
      </div>

      <!-- TAB 3: Atendente -->
      <div id="attendantTabContent" style="display: none;">
        <form id="attendantForm" class="flex-col">
          <div class="form-group">
            <label for="attendantLogin" class="form-label">Usuário Atendente</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">badge</span>
              <input type="text" id="attendantLogin" name="attendantLogin" class="input-field" placeholder="Ex: atendente1" required>
            </div>
          </div>

          <div class="form-group">
            <label for="attendantPassword" class="form-label">Senha de Acesso</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="attendantPassword" name="attendantPassword" class="input-field" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="btnAttendantSubmit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            <span>Acessar Painel de Atendimento</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">support_agent</span>
          </button>
        </form>
      </div>

      <!-- TAB 4: Gerente -->
      <div id="managerTabContent" style="display: none;">
        <form id="managerForm" class="flex-col">
          <div class="form-group">
            <label for="managerLogin" class="form-label">Usuário Gerente</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">manage_accounts</span>
              <input type="text" id="managerLogin" name="managerLogin" class="input-field" placeholder="Ex: gerente1" required>
            </div>
          </div>

          <div class="form-group">
            <label for="managerPassword" class="form-label">Senha de Gerência</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="managerPassword" name="managerPassword" class="input-field" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="btnManagerSubmit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            <span>Acessar Painel de Gestão</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">key</span>
          </button>
        </form>
      </div>

      <!-- Security Note -->
      <div style="text-align: center; margin-top: 8px;">
        <p style="font-size: 12px; color: var(--text-muted);">NeoOrder • Sistema Integrado de Gestão Gastronômica</p>
      </div>
    </div>
  </main>

  <!-- 3º: Demais scripts do sistema -->
  <script src="js/auth.js"></script>
</body>
</html>
